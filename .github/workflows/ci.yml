name: Sample App CI

on:
  push:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - "orders/**"
      - "payments/**"
  pull_request:
    branches: [dev, main]
    paths:
      - "frontend/**"
      - "orders/**"
      - "payments/**"

permissions:
  contents: write
  packages: write
  statuses: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/puliththewmika/deploylens-sample-app

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      orders: ${{ steps.filter.outputs.orders }}
      payments: ${{ steps.filter.outputs.payments }}
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - "frontend/**"
            orders:
              - "orders/**"
            payments:
              - "payments/**"

      - name: Build changed services list
        id: list
        run: |
          services=()
          if [ "${{ steps.filter.outputs.frontend }}" == "true" ]; then services+=("frontend"); fi
          if [ "${{ steps.filter.outputs.orders }}" == "true" ]; then services+=("orders"); fi
          if [ "${{ steps.filter.outputs.payments }}" == "true" ]; then services+=("payments"); fi
          echo "services=$(jq -cn '$ARGS.positional' --args "${services[@]}")" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}

  update-manifests:
    needs: [detect-changes, build-and-push]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in deployment manifests
        env:
          SHA: ${{ github.sha }}
          SERVICES: ${{ needs.detect-changes.outputs.services }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          SHORT_SHA="${SHA::7}"
          for service in $(echo "$SERVICES" | jq -r '.[]'); do
            manifest="deploy/${service}/deployment.yaml"
            echo "Updating ${manifest} → tag ${SHORT_SHA}"
            sed -i "s|image: ${IMAGE_PREFIX}-${service}:.*|image: ${IMAGE_PREFIX}-${service}:${SHORT_SHA}|" "$manifest"
          done

      - name: Commit and push tag bump
        env:
          SHA: ${{ github.sha }}
          SERVICES: ${{ needs.detect-changes.outputs.services }}
        run: |
          SHORT_SHA="${SHA::7}"
          git config user.name "Pulith Thewmika"
          git config user.email "puliththewmika@gmail.com"

          changed=$(echo "$SERVICES" | jq -r '.[]' | paste -sd, -)
          git add deploy/
          git diff --cached --quiet && echo "No manifest changes" && exit 0

          git commit -m "ci: bump image tags for ${changed} to ${SHORT_SHA}

          [skip ci]
          Original-Commit: ${SHA}"
          git push
          echo "BUMP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Copy commit status to tag-bump commit
        if: env.BUMP_SHA != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${BUMP_SHA} \
            -f state=success \
            -f context="Sample App CI" \
            -f description="All checks passed (status forwarded from ${GITHUB_SHA::7})" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
